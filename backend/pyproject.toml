[project]
name = "tele-schocken"
version = "0.1.0"
description = "Tele-Schocken: online dice game backend (Flask)"
license = "MIT"
readme = "../README.md"
requires-python = ">=3.11,<3.15"
dependencies = [
    "Flask (>=3.1.3,<4.0.0)",
    "Werkzeug (>=3.1.9,<4.0.0)",
    "Jinja2 (>=3.1.6,<4.0.0)",
    "MarkupSafe (>=3.0.0,<4.0.0)",
    "Flask-SQLAlchemy (>=3.1.1,<4.0.0)",
    "SQLAlchemy (>=2.0.0,<3.0.0)",
    "Flask-Migrate (>=4.0.0,<5.0.0)",
    "alembic (>=1.13.0,<2.0.0)",
    "Flask-Bootstrap (==3.3.7.1)",
    "Flask-Mail (>=0.10.0,<0.11.0)",
    "Flask-WTF (>=1.2.0,<2.0.0)",
    "WTForms (>=3.1.0,<4.0.0)",
    "Flask-SocketIO (>=5.5.0,<6.0.0)",
    "python-socketio (>=5.16.2,<6.0.0)",
    "python-engineio (>=4.13.2,<5.0.0)",
    "gevent (>=26.9.0)",
    "gunicorn (>=23.0.0)",
    "PyMySQL (>=1.1.1,<2.0.0)",
    "python-dateutil (>=2.9.0)",
    "python-dotenv (>=1.2.0,<2.0.0)",
]

[tool.poetry]
package-mode = false

[tool.poetry.group.test.dependencies]
pytest = "^9.1.1"

[tool.poetry.group.docs]
optional = true

[tool.poetry.group.docs.dependencies]
Sphinx = "^8.1.0"
sphinx-rtd-theme = "^3.0.0"
sphinxcontrib-httpdomain = "^1.8.1"

[tool.poetry.group.dev.dependencies]
pip-audit = "^2.10.1"
filelock = ">=4.2.1"

[tool.pytest.ini_options]
testpaths = ["tests"]

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"
