name: pip-audit

on:
  schedule:
    # Monday, Wednesday and Friday at 06:00 UTC
    - cron: "0 6 * * 1,3,5"
  workflow_dispatch:

jobs:
  pip-audit:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v5

      - name: Install Poetry
        run: pipx install poetry

      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: poetry
          cache-dependency-path: backend/poetry.lock

      - name: Install dependencies
        run: |
          poetry env use 3.13
          poetry install --with test,dev --no-interaction

      - name: Run pip-audit
        run: poetry run pip-audit --strict --desc
